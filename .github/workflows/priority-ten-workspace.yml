name: Priority ten workspace
on:
  push:
    branches: ['feat/priority-ten-20260919']
    paths: ['.github/workflows/priority-ten-workspace.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Archive dependencies without credentials or git metadata
        run: tar -czf /tmp/tamago-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: tamago-dependencies-workspace
          path: /tmp/tamago-dependencies.tar.gz
          retention-days: 1
